# ==============================================================================
# NxDesk Nginx Configuration (Producción con TLS / HTTPS / WSS)
# ==============================================================================
# Ubicación recomendada en Linux: /etc/nginx/sites-available/nxdesk.conf
# Enlace simbólico: ln -s /etc/nginx/sites-available/nxdesk.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Soporte para actualización de conexión WebSocket (Hop-by-hop header)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream para el Web Dashboard y Streaming WebSocket (Axum en nxdesk-client)
upstream nxdesk_dashboard {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Upstream para el Servidor Central de Señalización Multi-Sala (nxdesk-server)
upstream nxdesk_signaling {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# Redirección Forzada: HTTP (80) -> HTTPS (443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nxdesk.tu-dominio.com;

    # Permitir validación ACME de Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# Servidor Principal HTTPS / WSS (443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nxdesk.tu-dominio.com;

    # Certificados SSL/TLS (Gestionados por Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/nxdesk.tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nxdesk.tu-dominio.com/privkey.pem;

    # Parámetros TLS modernos y seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Encabezados de Seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamaño máximo de subida para transferencias de archivos
    client_max_body_size 100M;

    # Logs de acceso y errores
    access_log /var/log/nginx/nxdesk_access.log;
    error_log /var/log/nginx/nxdesk_error.log warn;

    # --------------------------------------------------------------------------
    # 1. Hub de Señalización WebSocket (nxdesk-server :5000)
    #    Ruta de conexión: wss://nxdesk.tu-dominio.com/signalinghub
    # --------------------------------------------------------------------------
    location /signalinghub {
        proxy_pass http://nxdesk_signaling;
        proxy_http_version 1.1;

        # WebSockets Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Preservar identidad del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evitar timeouts en conexiones WebSocket de larga duración
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. Web Dashboard y Stream WebSocket (nxdesk-client :8080)
    #    Ruta Web: https://nxdesk.tu-dominio.com/
    #    Canal WSS: wss://nxdesk.tu-dominio.com/ws/stream
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://nxdesk_dashboard;
        proxy_http_version 1.1;

        # WebSockets Headers (para /ws/stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Preservar identidad del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desactivar buffer para entrega instantánea de vídeo JPEG a 60 FPS
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

[package]
name = "nxdesk-client"
version = "0.1.0"
edition = "2021"

[dependencies]
nxdesk-core = { path = "../../crates/core" }
nxdesk-discovery = { path = "../../crates/discovery" }
nxdesk-input = { path = "../../crates/input" }
nxdesk-capture = { path = "../../crates/capture" }
nxdesk-signaling = { path = "../../crates/signaling" }
nxdesk-file-transfer = { path = "../../crates/file-transfer" }
nxdesk-terminal = { path = "../../crates/terminal" }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

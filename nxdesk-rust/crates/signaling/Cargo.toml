[package]
name = "nxdesk-signaling"
version = "0.1.0"
edition = "2021"

[dependencies]
nxdesk-core = { path = "../core" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
native-tls = "0.2"
socket2 = "0.5"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

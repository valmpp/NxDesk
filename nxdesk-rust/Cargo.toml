[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/signaling",
    "crates/capture",
    "crates/input",
    "crates/discovery",
    "crates/terminal",
    "crates/file-transfer",
    "apps/client",
    "apps/server"
]

# Optimiza librerías de compresión JPEG/SIMD incluso al correr con 'cargo run' para cero delay
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3